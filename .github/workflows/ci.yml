name: CI

# Pushes and pull requests run the checks only. A native build is never
# triggered automatically: it costs EAS Build minutes and creates a real App
# Store Connect submission, so it has to be asked for by hand through
# workflow_dispatch with `ios_release` ticked.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      ios_release:
        description: >-
          Also build a native iOS binary with EAS Build and submit it to
          TestFlight. Opt-in per run: unlike the checks above it consumes EAS
          Build minutes and creates a real App Store Connect submission.
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json', 'firebase.rules-test.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Lint
        # Errors fail the build. The React Compiler rules are configured as
        # warnings in eslint.config.js (see the rationale there), so they show
        # up in the log without blocking.
        run: npx eslint . --max-warnings 60
      - name: Firebase security rules tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npm run test:rules 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if grep -q "Skipping Firebase rules tests" <<< "$output"; then
            echo "::error::Firebase rules tests skipped. CI must run the emulator backed suite."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if ! grep -q "ok: player cannot read another player private view" <<< "$output"; then
            echo "::error::Firebase rules tests did not print the private view sentinel."
            exit 1
          fi
          if ! grep -q "ok: either side can remove a friendship" <<< "$output"; then
            echo "::error::Firebase rules tests did not reach the final assertion."
            exit 1
          fi

  # Builds a real native iOS binary and submits it to TestFlight. Opt-in per
  # run via the `ios_release` input, and gated behind `test` so a release can
  # never skip the checks.
  #
  # Apple authentication is an App Store Connect API key only, never an Apple
  # ID and password, because an Apple ID login needs two-factor confirmation
  # that nothing unattended can satisfy.
  #
  # Note the difference from the bestplan repo, which is where this job comes
  # from: that repo is private, so it can keep the key ID and issuer ID as
  # literals in `eas.json`. This repo is public, so all three key fields stay
  # out of the committed config and arrive as environment variables instead.
  # eas-cli supports that route directly: `resolveAscApiKeyAsync` reads
  # EXPO_ASC_API_KEY_PATH, EXPO_ASC_KEY_ID and EXPO_ASC_ISSUER_ID, and both
  # build and submit go through it.
  ios-release:
    name: Build and submit iOS (TestFlight)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.ios_release
    # 60 minutes was not enough and cancelled a submit that was still queued.
    # Two EAS queues run back to back here, build then submit, and on the free
    # tier either can sit for a long time before it starts. The timeout is a
    # guard against a genuinely stuck job, so it should sit well clear of
    # normal queueing rather than close to it.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: eas-cli pulls in @oclif/plugin-autocomplete, which
      # declares engines node >=22 and makes the install fail outright on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # `EXPO_PUBLIC_*` values are inlined into the JS bundle at build time, and
      # that bundling happens on EAS's worker, not here, so exporting them as
      # step env would do nothing. EAS reads the build profile's `env` block, so
      # write them there from secrets. `.env` is gitignored and never reaches
      # the runner, which is why a cloud build previously shipped with no
      # Firebase config at all: the app installed and ran, but every online
      # feature silently reported itself as not configured.
      #
      # These are public client identifiers rather than secrets. They live in
      # GitHub secrets only so the public repository stays free of project
      # identifiers, matching how the App Store Connect fields are handled below.
      - name: Add runtime config to eas.json
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            // Online play is dead without these three, and the failure is
            // silent in the app, so refuse to build rather than ship it.
            const required = [
              "EXPO_PUBLIC_FIREBASE_API_KEY",
              "EXPO_PUBLIC_FIREBASE_DATABASE_URL",
              "EXPO_PUBLIC_FIREBASE_PROJECT_ID",
            ];
            const optional = [
              "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN",
              "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET",
              "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
              "EXPO_PUBLIC_FIREBASE_APP_ID",
              "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID",
              "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID",
              "EXPO_PUBLIC_SENTRY_DSN",
            ];
            const missing = required.filter((k) => !process.env[k]);
            if (missing.length) {
              console.error("::error::Missing repository secrets: " + missing.join(", ") + ". See docs/online/ENABLING-ONLINE.md.");
              process.exit(1);
            }
            const easJson = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const env = easJson.build.production.env ?? {};
            for (const key of required.concat(optional)) {
              if (process.env[key]) env[key] = process.env[key];
            }
            easJson.build.production.env = env;
            fs.writeFileSync("eas.json", JSON.stringify(easJson, null, 2) + "\n");
            console.log("Configured " + Object.keys(env).length + " public runtime variables.");
          '

      # The key is a .p8 private key, so it has to reach eas-cli as a file
      # rather than a value. `umask 077` means it is created unreadable to
      # anyone else, and `printf %s` avoids the trailing newline and the
      # backslash interpretation that `echo` would apply to the PEM body.
      # *.p8 is gitignored, so the file can never be committed by accident.
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_P8:-}" ]; then
            echo "::error::APPSTORE_CONNECT_API_KEY_P8 is not set. See docs/store/EAS-SUBMIT.md."
            exit 1
          fi
          umask 077
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build iOS (production profile)
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: D7VUBSSP2F
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: eas build --platform ios --profile production --non-interactive --wait

      # `eas submit` does not read the EXPO_ASC_* variables that `eas build`
      # accepts. It only looks at the submit profile in eas.json or at a key
      # already stored in the EAS credentials service, and in non-interactive
      # mode it refuses to set one up, failing with "App Store Connect API
      # Keys cannot be set up in --non-interactive mode."
      #
      # bestplan solves this by committing the three key fields, which it can
      # do because it is private. Here they are written into eas.json at run
      # time from secrets instead. The file is modified only on the runner and
      # never committed, so the public repository keeps no key identifiers.
      - name: Add submit credentials to eas.json
        env:
          KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const easJson = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            Object.assign(easJson.submit.production.ios, {
              ascApiKeyPath: process.env.RUNNER_TEMP + "/AuthKey.p8",
              ascApiKeyId: process.env.KEY_ID,
              ascApiKeyIssuerId: process.env.ISSUER_ID,
            });
            fs.writeFileSync("eas.json", JSON.stringify(easJson, null, 2) + "\n");
          '

      # --latest picks the build the previous step just finished.
      - name: Submit to TestFlight
        run: eas submit --platform ios --latest --non-interactive

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
